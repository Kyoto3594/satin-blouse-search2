<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>サテンブラウス画像検索（iPhone版）</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{margin:0;background:#f5f5f7;color:#1d1d1f} main{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
h1{font-size:23px;margin:4px 0 8px}h2{font-size:18px;margin:0 0 10px}.muted{color:#666;font-size:13px;line-height:1.55}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#007aff;color:#fff;margin:4px 4px 4px 0}button.secondary{background:#e9e9ed;color:#222}button:disabled{opacity:.45}
input[type=file]{width:100%;font-size:16px}input[type=range]{width:100%}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:#fafafa;border-radius:12px;overflow:hidden}.item img{width:100%;aspect-ratio:1/1;object-fit:cover}.item p{margin:7px 9px;font-size:13px}.score{font-weight:700}
#status{white-space:pre-wrap;line-height:1.5}.ok{color:#16803c}.err{color:#b42318}progress{width:100%;height:14px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;font-size:12px;margin-top:5px}
</style>
</head>
<body>
<main>
<h1>サテンブラウス画像検索</h1>
<p class="muted">iPhoneのSafariで動作します。写真そのものはサーバーへ送らず、選択した端末内の画像をAIで順番に判定します。</p>

<div class="card">
<h2>① 写真を選択</h2>
<input id="files" type="file" accept="image/*" multiple>
<p class="muted">最初のテストは<strong>1～3枚</strong>をおすすめします。動作確認後は枚数を増やせます。</p>
</div>

<div class="card">
<h2>② 判定条件</h2>
<label>サテンブラウスらしさ：<b id="thresholdText">35%</b>以上</label>
<input id="threshold" type="range" min="20" max="80" value="35">
<p class="muted">低くすると候補が増えます。まず35%程度で試してください。</p>
<button id="run">解析する</button>
<button id="clear" class="secondary">クリア</button>
</div>

<div class="card">
<h2>③ 解析状況</h2>
<div id="status">まだ解析していません。</div>
<div id="mode" class="badge" style="display:none"></div>
<progress id="progress" value="0" max="100"></progress>
</div>

<div class="card">
<h2>④ 結果</h2>
<div id="results" class="grid"></div>
</div>
</main>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0';

env.allowLocalModels = false;
env.useBrowserCache = true;

const filesEl=document.querySelector('#files');
const runBtn=document.querySelector('#run');
const clearBtn=document.querySelector('#clear');
const statusEl=document.querySelector('#status');
const progressEl=document.querySelector('#progress');
const resultsEl=document.querySelector('#results');
const thresholdEl=document.querySelector('#threshold');
const thresholdText=document.querySelector('#thresholdText');
const modeEl=document.querySelector('#mode');

thresholdEl.oninput=()=>thresholdText.textContent=thresholdEl.value+'%';
let files=[];
let classifier=null;
let loadingPromise=null;

const MODEL='Xenova/mobileclip_s0';
const LABELS=[
  'a person wearing a satin blouse',
  'a person wearing a non-satin blouse',
  'a person not wearing a blouse'
];

function setStatus(msg, cls=''){statusEl.textContent=msg;statusEl.className=cls;}
function setMode(msg){modeEl.textContent=msg;modeEl.style.display=msg?'inline-block':'none';}

filesEl.onchange=()=>{
  files=[...filesEl.files];
  resultsEl.innerHTML=''; progressEl.value=0;
  setStatus(files.length+'枚選択しました。');
};

async function makeSmallImage(file){
  const bitmap=await createImageBitmap(file);
  const max=900;
  const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
  const w=Math.max(1,Math.round(bitmap.width*scale));
  const h=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d',{alpha:false});
  ctx.drawImage(bitmap,0,0,w,h); bitmap.close();
  return await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.82));
}

async function loadClassifier(){
  if(classifier) return classifier;
  if(loadingPromise) return loadingPromise;

  loadingPromise=(async()=>{
    setStatus('AIモデルを準備しています。初回だけ時間がかかります。\niPhone向けの軽量モデルを起動します。');
    try{
      if(!('gpu' in navigator)) throw new Error('このSafariではWebGPUが利用できません');
      classifier=await pipeline('zero-shot-image-classification',MODEL,{device:'webgpu',dtype:'fp16'});
      setMode('iPhone GPU（WebGPU）');
      return classifier;
    }catch(webgpuError){
      console.warn('WebGPU failed; falling back to WASM',webgpuError);
      setStatus('GPU処理を使えないため、iPhone向けの軽量CPU処理へ切り替えています。\n少し時間がかかります。');
      try{
        classifier=await pipeline('zero-shot-image-classification',MODEL,{device:'wasm',dtype:'q8'});
        setMode('互換モード（CPU/WASM）');
        return classifier;
      }catch(cpuError){
        classifier=null;
        throw new Error('AIモデルを起動できませんでした。Safariを一度完全に閉じてから再度お試しください。\n\n詳細: '+cpuError.message);
      }
    }
  })();
  try{return await loadingPromise;}finally{loadingPromise=null;}
}

runBtn.onclick=async()=>{
  if(!files.length){alert('まず写真を選択してください。');return;}
  runBtn.disabled=true; clearBtn.disabled=true; resultsEl.innerHTML=''; progressEl.value=0;
  try{
    const pipe=await loadClassifier();
    const out=[];
    for(let i=0;i<files.length;i++){
      setStatus(`画像 ${i+1}/${files.length} を解析中…\n画像は1枚ずつ処理しています。`);
      const small=await makeSmallImage(files[i]);
      const url=URL.createObjectURL(small);
      try{
        const r=await pipe(url,{candidate_labels:LABELS});
        const satin=r.find(x=>x.label===LABELS[0])?.score||0;
        out.push({file:files[i],score:satin});
      }finally{URL.revokeObjectURL(url);}
      progressEl.value=((i+1)/files.length)*100;
      // Safariに描画・メモリ回収の機会を与える
      await new Promise(requestAnimationFrame);
    }
    out.sort((a,b)=>b.score-a.score);
    const th=Number(thresholdEl.value)/100;
    const filtered=out.filter(x=>x.score>=th);
    setStatus(`解析完了：${out.length}枚中、${filtered.length}枚を候補として表示しました。`,'ok');
    for(const x of filtered){
      const url=URL.createObjectURL(x.file);
      const div=document.createElement('div'); div.className='item';
      div.innerHTML=`<img loading="lazy" src="${url}"><p><span class="score">${Math.round(x.score*100)}%</span><br>${escapeHtml(x.file.name)}</p>`;
      resultsEl.appendChild(div);
    }
    if(!filtered.length){
      resultsEl.innerHTML='<p class="muted">候補がありません。閾値を下げて再解析してください。</p>';
    }
  }catch(e){
    console.error(e);
    setStatus('解析を開始できませんでした。\n\n'+(e?.message||String(e)),'err');
  }finally{runBtn.disabled=false;clearBtn.disabled=false;}
};

clearBtn.onclick=()=>{files=[];filesEl.value='';resultsEl.innerHTML='';progressEl.value=0;setStatus('クリアしました。');setMode('');};
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
